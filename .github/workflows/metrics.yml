name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34.0
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: choco721
          filename: github-metrics.svg
          template: classic
          config_timezone: America/Argentina/Buenos_Aires

          # Tema oscuro (el look de la captura que te gustaba)
          config_display: regular
          config_padding: 6%

          base: header, activity, community, repositories, metadata

          # Calendario 3D
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Lenguajes: notebooks contados como su lenguaje real,
          # y colapsados para que Python no quede aplastado
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, makefile, dockerfile
          plugin_languages_colors: github
          plugin_languages_details: bytes-size, percentage
          plugin_languages_threshold: 1%
          plugin_languages_analysis_timeout: 15

          # Hábitos: actividad por hora del día
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_from: 100

          # Líneas de código agregadas/eliminadas
          plugin_lines: yes
